<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEMS·POS 지점 운영 가이드</title>
<meta name="description" content="외국인 환전예약 — 지점에서 쓰는 CEMS·POS 화면과 버튼을 한곳에 정리한 운영 가이드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --side: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f3f5f8;
    --ink: #191f28;
    --ink-2: #4e5968;
    --muted: #8b95a1;
    --line: #e5e8eb;
    --blue: #1b64da;
    --blue-soft: #e8f1fd;
    --red: #e02d2d;
    --red-soft: rgba(224, 45, 45, 0.10);
    --ok: #1a8d4f;
    --ok-bg: #ebf7ef;
    --ok-line: #bfe3cc;
    --warn: #c76a00;
    --warn-bg: #fff6e8;
    --warn-line: #f4d3a2;
    --danger: #d22f2f;
    --danger-bg: #fdeeee;
    --danger-line: #f3c2c2;
    --overlay: rgba(10, 14, 20, 0.86);
    --font: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c;
      --side: #1d1f24;
      --surface: #1f2228;
      --surface-2: #272a31;
      --ink: #eceef1;
      --ink-2: #b5bcc6;
      --muted: #858d99;
      --line: #30343c;
      --blue: #6aa2ff;
      --blue-soft: #1e2b44;
      --red: #ff5c5c;
      --red-soft: rgba(255, 92, 92, 0.14);
      --ok: #5ed191;
      --ok-bg: #16281e;
      --ok-line: #2a4a37;
      --warn: #ffb55c;
      --warn-bg: #2d2316;
      --warn-line: #4d3a1f;
      --danger: #ff7b7b;
      --danger-bg: #2f1a1a;
      --danger-line: #503030;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c;
    --side: #1d1f24;
    --surface: #1f2228;
    --surface-2: #272a31;
    --ink: #eceef1;
    --ink-2: #b5bcc6;
    --muted: #858d99;
    --line: #30343c;
    --blue: #6aa2ff;
    --blue-soft: #1e2b44;
    --red: #ff5c5c;
    --red-soft: rgba(255, 92, 92, 0.14);
    --ok: #5ed191;
    --ok-bg: #16281e;
    --ok-line: #2a4a37;
    --warn: #ffb55c;
    --warn-bg: #2d2316;
    --warn-line: #4d3a1f;
    --danger: #ff7b7b;
    --danger-bg: #2f1a1a;
    --danger-line: #503030;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }

  /* ── 헤더 ── */
  .hdr {
    position: sticky; top: 0; z-index: 30; height: 64px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
  }
  .menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; height: 38px; cursor: pointer; }
  .logo { font-weight: 900; font-size: 18px; letter-spacing: .01em; white-space: nowrap; color: var(--ink); }
  .logo:hover { text-decoration: none; }
  .hdr-title { font-weight: 500; font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .sp { flex: 1; }
  .search { position: relative; width: 380px; max-width: 40vw; }
  .search input {
    width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); padding: 0 14px 0 38px; font: inherit; font-size: 14px;
  }
  .search input:focus { outline: 2px solid var(--blue); outline-offset: -1px; background: var(--surface); }
  .search svg { position: absolute; left: 13px; top: 13px; color: var(--muted); }
  .search-res {
    position: absolute; top: 48px; left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14);
    max-height: 60vh; overflow: auto; display: none; padding: 6px;
  }
  .search-res.open { display: block; }
  .search-res a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--ink); }
  .search-res a:hover, .search-res a.on { background: var(--blue-soft); text-decoration: none; }
  .search-res small { display: block; color: var(--muted); font-size: 12px; }
  .search-res .empty { padding: 12px; color: var(--muted); font-size: 14px; }
  .theme-btn {
    height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2);
    white-space: nowrap;
  }

  /* ── 레이아웃 ── */
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 220px; min-height: calc(100vh - 64px); }
  .side {
    position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto;
    background: var(--side); border-right: 1px solid var(--line); padding: 24px 14px 40px;
  }
  .side h4 { margin: 18px 12px 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .side h4:first-child { margin-top: 0; }
  .side a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); font-size: 15px; }
  .side a:hover { background: var(--surface-2); text-decoration: none; }
  .side a.on { background: var(--blue-soft); color: var(--blue); font-weight: 700; }

  main { padding: 52px 56px 80px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .crumb { font-size: 13px; color: var(--muted); }
  main h1 { font-size: 34px; font-weight: 900; margin: 6px 0 14px; line-height: 1.3; letter-spacing: -.01em; }
  .lead { font-size: 17px; color: var(--ink-2); margin: 0 0 32px; }
  main h2 { font-size: 24px; font-weight: 900; margin: 52px 0 16px; scroll-margin-top: 84px; }
  main h3 { font-size: 18px; font-weight: 700; margin: 30px 0 10px; scroll-margin-top: 84px; }
  main p { margin: 10px 0; color: var(--ink); }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 6px 0; }
  .muted { color: var(--muted); }
  kbd, .btnlabel {
    display: inline-block; font: inherit; font-size: .88em; font-weight: 700; padding: 1px 8px;
    border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
  }
  code { font-size: .9em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }

  /* 안내 박스 */
  .callout { display: flex; gap: 12px; border-radius: 12px; padding: 18px 20px; margin: 22px 0; border: 1px solid; }
  .callout .ic { flex: none; width: 28px; height: 28px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; margin-top: 1px; }
  .callout .tx p { margin: 0 0 6px; }
  .callout .tx p:last-child { margin: 0; }
  .callout.tip { background: var(--ok-bg); border-color: var(--ok-line); }
  .callout.tip .ic { background: var(--ok); }
  .callout.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .callout.warn .ic { background: var(--warn); }
  .callout.danger { background: var(--danger-bg); border-color: var(--danger-line); }
  .callout.danger .ic { background: var(--danger); }

  /* 카드 */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
  .card {
    display: block; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; background: var(--surface); color: var(--ink);
  }
  a.card:hover { border-color: var(--blue); text-decoration: none; }
  .card b { display: block; font-size: 16px; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 14px; }

  /* 표 */
  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 560px; }
  th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--surface-2); font-weight: 700; font-size: 14px; color: var(--ink-2); }
  tr:last-child td { border-bottom: 0; }

  /* 번호 주석 스크린샷 */
  figure.shot { margin: 24px 0 0; }
  .shot-frame {
    position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--surface-2); cursor: zoom-in;
  }
  .shot-frame img { display: block; width: 100%; height: auto; }
  .mk { position: absolute; border: 2.5px solid var(--red); border-radius: 4px; transition: background .15s, box-shadow .15s; pointer-events: none; }
  .mk.hl { background: var(--red-soft); box-shadow: 0 0 0 4px rgba(224, 45, 45, .25); }
  .mk-n {
    position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #e02d2d; color: #fff;
    font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transform: translate(-60%, -50%);
    pointer-events: auto;
  }
  figcaption { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 8px 2px 0; }
  figcaption button { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 0; font-size: 14px; }
  .anno { list-style: none; padding: 0 !important; margin: 18px 0 0; border-top: 1px solid var(--line); }
  .anno li { display: flex; gap: 16px; padding: 18px 10px; border-bottom: 1px solid var(--line); margin: 0; border-radius: 8px; transition: background .15s; }
  .anno li:hover, .anno li.hl { background: var(--surface-2); }
  .anno .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #e02d2d; color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .anno .t { display: block; font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .anno .d { color: var(--ink-2); }

  /* 단계 */
  .steps { list-style: none; padding: 0 !important; counter-reset: s; margin: 16px 0; }
  .steps > li { counter-increment: s; position: relative; padding: 4px 0 18px 46px; margin: 0; }
  .steps > li::before {
    content: counter(s); position: absolute; left: 0; top: 2px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--blue); color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .steps > li:not(:last-child)::after { content: ''; position: absolute; left: 14px; top: 36px; bottom: 2px; width: 2px; background: var(--line); }
  .steps > li > b { display: block; font-size: 16px; }
  .steps > li > span { color: var(--ink-2); }

  /* 체크리스트 */
  .checklist { list-style: none; padding: 0 !important; }
  .checklist li { padding: 12px 14px 12px 46px; position: relative; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
  .checklist li::before { content: ''; position: absolute; left: 16px; top: 16px; width: 16px; height: 16px; border: 2px solid var(--blue); border-radius: 4px; }
  .checklist small { color: var(--muted); display: block; }

  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
  .b-blue { background: var(--blue-soft); color: var(--blue); }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-red { background: var(--danger-bg); color: var(--danger); }
  .b-gray { background: var(--surface-2); color: var(--muted); }

  /* 관련 글 · 이전/다음 */
  .related { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); }
  .related h4 { margin: 0 0 8px; font-size: 17px; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 44px; }
  .pager a { border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; color: var(--ink); font-size: 17px; }
  .pager a:hover { border-color: var(--blue); text-decoration: none; }
  .pager small { display: block; color: var(--blue); font-size: 13px; margin-bottom: 2px; opacity: .8; }
  .pager .next { text-align: right; grid-column: 2; }
  .foot-note { margin-top: 40px; font-size: 13px; color: var(--muted); }

  /* 이 페이지 내용 */
  .toc { position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; padding: 52px 20px 40px 0; }
  .toc h5 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .toc ul { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
  .toc a { display: block; padding: 5px 0 5px 14px; margin-left: -2px; border-left: 2px solid transparent; font-size: 14px; color: var(--ink-2); }
  .toc a.on { color: var(--blue); border-left-color: var(--blue); font-weight: 700; }
  .toc a:hover { text-decoration: none; color: var(--blue); }

  /* 라이트박스 */
  .lb { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: none; flex-direction: column; padding: 14px 20px 20px; }
  .lb.open { display: flex; }
  .lb-top { display: flex; align-items: center; justify-content: space-between; color: #fff; margin-bottom: 10px; gap: 12px; }
  .lb-top b { font-size: 17px; }
  .lb-close { background: #fff; color: #191f28; border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 700; cursor: pointer; font-size: 16px; }
  .lb-stage { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
  .lb-inner { position: relative; width: min(100%, 1600px); }
  .lb-inner img { display: block; width: 100%; border-radius: 8px; }
  .lb-inner .mk-n { cursor: pointer; width: 30px; height: 30px; font-size: 14px; }
  .lb-tip {
    position: absolute; z-index: 2; max-width: 340px; background: #fff; color: #191f28; border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.3); font-size: 14px; line-height: 1.6; display: none;
  }
  .lb-tip .t { display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px; }

  .side-dim { display: none; }

  @media (max-width: 1280px) {
    .layout { grid-template-columns: 270px minmax(0, 1fr); }
    .toc { display: none; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
    .side {
      position: fixed; top: 64px; left: 0; bottom: 0; height: auto; width: 290px; z-index: 25;
      transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.12);
    }
    body.nav-open .side { transform: none; }
    body.nav-open .side-dim { display: block; position: fixed; inset: 64px 0 0 0; z-index: 20; background: rgba(0,0,0,.3); }
    main { padding: 32px 16px 64px; }
    main h1 { font-size: 27px; }
    .cards { grid-template-columns: 1fr; }
    .hdr { padding: 0 12px; gap: 8px; }
    .hdr-title { display: none; }
    .search { width: auto; flex: 1; min-width: 0; max-width: none; }
    .logo { font-size: 15px; }
    .hdr .sp { display: none; }
    .theme-btn { padding: 0 11px; }
    .theme-btn span { display: none; }
    .pager { grid-template-columns: 1fr; }
    .pager .next { grid-column: 1; }
    .mk-n { width: 20px; height: 20px; font-size: 11px; border-width: 1.5px; }
  }
  @media (max-width: 1100px) and (min-width: 901px) { .cards { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="hdr">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="logo" href="#/home">MONEY BOX</a>
  <span class="hdr-title" id="siteTitle">CEMS·POS 지점 운영 가이드</span>
  <span class="sp"></span>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="찾고 싶은 기능을 입력하세요" autocomplete="off" aria-label="가이드 검색">
    <div class="search-res" id="qres" role="listbox"></div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="테마 전환">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span id="themeLabel">다크 모드</span>
  </button>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="가이드 목차"></nav>
  <div class="side-dim" id="sideDim"></div>
  <main id="main"></main>
  <aside class="toc" id="toc" aria-label="이 페이지 내용"></aside>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="화면 크게 보기">
  <div class="lb-top"><b>빨간 번호를 누르면 설명이 나와요</b><button class="lb-close" id="lbClose">닫기</button></div>
  <div class="lb-stage"><div class="lb-inner" id="lbInner"></div></div>
</div>

<script src="content.js"></script>
<script>
(function () {
  var G = window.GUIDE;
  var PAGES = [];
  G.nav.forEach(function (grp) {
    grp.pages.forEach(function (slug) {
      var p = G.pages[slug];
      if (!p) return;
      p.slug = slug; p.group = grp.group;
      PAGES.push(p);
    });
  });
  document.getElementById('siteTitle').textContent = G.title;

  // ── 테마 ──
  var root = document.documentElement;
  function sysDark() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : sysDark(); }
  function paintThemeBtn() { document.getElementById('themeLabel').textContent = isDark() ? '라이트 모드' : '다크 모드'; }
  try { var saved = localStorage.getItem('bg-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  paintThemeBtn();
  document.getElementById('themeBtn').onclick = function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('bg-theme', next); } catch (e) {}
    paintThemeBtn();
  };

  // ── 사이드바 ──
  var side = document.getElementById('side');
  side.innerHTML = G.nav.map(function (grp) {
    return '<h4>' + grp.group + '</h4>' + grp.pages.filter(function (s) { return G.pages[s]; }).map(function (s) {
      return '<a href="#/' + s + '" data-slug="' + s + '">' + G.pages[s].title + '</a>';
    }).join('');
  }).join('');
  document.getElementById('menuBtn').onclick = function () { document.body.classList.toggle('nav-open'); };
  document.getElementById('sideDim').onclick = function () { document.body.classList.remove('nav-open'); };

  // ── 블록 렌더 ──
  var figs = {};
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function markers(f) {
    return f.marks.map(function (m, i) {
      var b = m.box;
      return '<div class="mk" data-i="' + i + '" style="left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[2] + '%;height:' + b[3] + '%"></div>' +
        '<div class="mk-n" data-i="' + i + '" style="left:' + b[0] + '%;top:' + (b[1] + Math.min(b[3] / 2, 3)) + '%">' + (i + 1) + '</div>';
    }).join('');
  }
  function renderBlock(b, idx) {
    if (typeof b === 'string') return b;
    if (b.type === 'figure') {
      var id = 'fig' + idx; figs[id] = b;
      return '<figure class="shot" data-fig="' + id + '">' +
        '<div class="shot-frame" data-fig="' + id + '" title="눌러서 크게 보기"><img src="' + b.src + '" alt="' + esc(b.caption) + '" loading="lazy">' + markers(b) + '</div>' +
        '<figcaption><span>' + b.caption + '</span><button type="button" data-zoom="' + id + '">크게 보기</button></figcaption>' +
        '<ol class="anno">' + b.marks.map(function (m, i) {
          return '<li data-fig="' + id + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><div><span class="t">' + m.title + '</span><div class="d">' + m.desc + '</div></div></li>';
        }).join('') + '</ol></figure>';
    }
    if (b.type === 'callout') {
      var ic = { tip: '✓', warn: '!', danger: '!' }[b.tone || 'tip'];
      return '<div class="callout ' + (b.tone || 'tip') + '"><span class="ic">' + ic + '</span><div class="tx">' + b.html + '</div></div>';
    }
    if (b.type === 'cards') {
      return '<div class="cards">' + b.items.map(function (c) {
        return '<a class="card" href="#/' + c.to + '"><b>' + c.title + '</b><span>' + c.desc + '</span></a>';
      }).join('') + '</div>';
    }
    if (b.type === 'table') {
      return '<div class="tbl"><table><thead><tr>' + b.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + b.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    if (b.type === 'steps') {
      return '<ol class="steps">' + b.items.map(function (s) {
        return '<li><b>' + s[0] + '</b><span>' + (s[1] || '') + '</span></li>';
      }).join('') + '</ol>';
    }
    if (b.type === 'checklist') {
      return '<ul class="checklist">' + b.items.map(function (s) {
        return '<li>' + (Array.isArray(s) ? s[0] + '<small>' + s[1] + '</small>' : s) + '</li>';
      }).join('') + '</ul>';
    }
    return '';
  }
  function slugify(t, i) { return 's' + i; }

  // ── 페이지 렌더 ──
  var main = document.getElementById('main'), toc = document.getElementById('toc');
  function render() {
    var slug = (location.hash.match(/^#\/([\w-]+)/) || [])[1];
    if (G.alias && G.alias[slug]) slug = G.alias[slug];
    var i = PAGES.findIndex(function (p) { return p.slug === slug; });
    if (i < 0) { i = 0; history.replaceState(null, '', '#/' + PAGES[0].slug); }
    var p = PAGES[i], prev = PAGES[i - 1], next = PAGES[i + 1];
    figs = {};
    var html = '<div class="crumb">' + p.group + '</div><h1>' + p.title + '</h1><p class="lead">' + p.lead + '</p>' +
      p.blocks.map(renderBlock).join('');
    if (p.related && p.related.length) {
      html += '<div class="related"><h4>관련 글 더 보기</h4><ul>' + p.related.filter(function (s) { return G.pages[s]; }).map(function (s) {
        return '<li><a href="#/' + s + '">' + G.pages[s].title + '</a></li>';
      }).join('') + '</ul></div>';
    }
    html += '<div class="pager">' +
      (prev ? '<a class="prev" href="#/' + prev.slug + '"><small>이전</small>' + prev.title + '</a>' : '') +
      (next ? '<a class="next" href="#/' + next.slug + '"><small>다음</small>' + next.title + '</a>' : '') + '</div>' +
      '<div class="foot-note">' + G.footer + '</div>';
    main.innerHTML = html;

    var hs = main.querySelectorAll('h2');
    hs.forEach(function (h, k) { h.id = slugify(h.textContent, k); });
    toc.innerHTML = hs.length ? '<h5>이 페이지 내용</h5><ul>' + Array.prototype.map.call(hs, function (h) {
      return '<li><a href="#/' + p.slug + '" data-to="' + h.id + '">' + h.textContent + '</a></li>';
    }).join('') + '</ul>' : '';

    side.querySelectorAll('a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-slug') === p.slug); });
    var on = side.querySelector('a.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    document.body.classList.remove('nav-open');
    document.title = p.title + ' · ' + G.title;
    window.scrollTo(0, 0);
    spy();
  }

  // TOC 클릭 · 스크롤 스파이
  toc.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-to]'); if (!a) return;
    e.preventDefault();
    var t = document.getElementById(a.getAttribute('data-to'));
    if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  });
  function spy() {
    var links = toc.querySelectorAll('a[data-to]'), cur = null;
    links.forEach(function (a) {
      var t = document.getElementById(a.getAttribute('data-to'));
      if (t && t.getBoundingClientRect().top < 120) cur = a;
    });
    if (!cur && links[0]) cur = links[0];
    links.forEach(function (a) { a.classList.toggle('on', a === cur); });
  }
  window.addEventListener('scroll', spy, { passive: true });

  // 주석 ↔ 화면 하이라이트
  function hl(figId, i, on) {
    var fig = main.querySelector('figure[data-fig="' + figId + '"]'); if (!fig) return;
    var m = fig.querySelector('.mk[data-i="' + i + '"]'); if (m) m.classList.toggle('hl', on);
    var li = fig.querySelector('.anno li[data-i="' + i + '"]'); if (li) li.classList.toggle('hl', on);
  }
  main.addEventListener('mouseover', function (e) {
    var li = e.target.closest('.anno li'); if (li) hl(li.getAttribute('data-fig'), li.getAttribute('data-i'), true);
  });
  main.addEventListener('mouseout', function (e) {
    var li = e.target.closest('.anno li'); if (li) hl(li.getAttribute('data-fig'), li.getAttribute('data-i'), false);
  });
  main.addEventListener('click', function (e) {
    var z = e.target.closest('[data-zoom]') || e.target.closest('.shot-frame');
    if (z) openLb(z.getAttribute('data-zoom') || z.getAttribute('data-fig'));
  });

  // 라이트박스
  var lb = document.getElementById('lb'), lbInner = document.getElementById('lbInner');
  function openLb(id) {
    var f = figs[id]; if (!f) return;
    lbInner.innerHTML = '<img src="' + f.src + '" alt="' + esc(f.caption) + '">' + markers(f) + '<div class="lb-tip" id="lbTip"></div>';
    lbInner._fig = f;
    lb.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  document.getElementById('lbClose').onclick = closeLb;
  lb.addEventListener('click', function (e) {
    var n = e.target.closest('.mk-n');
    var tip = document.getElementById('lbTip');
    if (n) {
      var i = +n.getAttribute('data-i'), m = lbInner._fig.marks[i];
      lbInner.querySelectorAll('.mk').forEach(function (x) { x.classList.toggle('hl', +x.getAttribute('data-i') === i); });
      tip.innerHTML = '<span class="t">' + (i + 1) + '. ' + m.title + '</span>' + m.desc;
      tip.style.display = 'block';
      var W = lbInner.clientWidth, x = n.offsetLeft + 20, y = n.offsetTop + 20;
      tip.style.left = Math.max(0, Math.min(x, W - Math.min(340, W))) + 'px';
      tip.style.top = y + 'px';
      return;
    }
    if (e.target === lb || e.target.classList.contains('lb-stage')) closeLb();
    else if (tip && !e.target.closest('.lb-tip')) tip.style.display = 'none';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeLb(); closeQ(); } });

  // ── 검색 ──
  var q = document.getElementById('q'), qres = document.getElementById('qres');
  var idx = PAGES.map(function (p) {
    var tmp = document.createElement('div');
    tmp.innerHTML = p.blocks.map(function (b) {
      if (typeof b === 'string') return b;
      if (b.type === 'figure') return b.marks.map(function (m) { return m.title + ' ' + m.desc; }).join(' ');
      if (b.type === 'table') return b.rows.map(function (r) { return r.join(' '); }).join(' ');
      if (b.type === 'steps') return b.items.map(function (s) { return s.join(' '); }).join(' ');
      if (b.type === 'checklist') return b.items.map(function (s) { return [].concat(s).join(' '); }).join(' ');
      if (b.type === 'cards') return b.items.map(function (c) { return c.title + ' ' + c.desc; }).join(' ');
      return b.html || '';
    }).join(' ');
    return { p: p, text: (p.title + ' ' + p.lead + ' ' + tmp.textContent).toLowerCase() };
  });
  function closeQ() { qres.classList.remove('open'); }
  q.addEventListener('input', function () {
    var v = q.value.trim().toLowerCase();
    if (!v) return closeQ();
    var terms = v.split(/\s+/);
    var hits = idx.filter(function (x) { return terms.every(function (t) { return x.text.indexOf(t) >= 0; }); })
      .sort(function (a, b) { return (b.p.title.toLowerCase().indexOf(terms[0]) >= 0) - (a.p.title.toLowerCase().indexOf(terms[0]) >= 0); });
    qres.innerHTML = hits.length ? hits.slice(0, 8).map(function (x, k) {
      return '<a href="#/' + x.p.slug + '"' + (k === 0 ? ' class="on"' : '') + '>' + x.p.title + '<small>' + x.p.group + '</small></a>';
    }).join('') : '<div class="empty">검색 결과가 없어요.</div>';
    qres.classList.add('open');
  });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var a = qres.querySelector('a.on'); if (a) { location.hash = a.getAttribute('href'); q.value = ''; closeQ(); q.blur(); } }
  });
  qres.addEventListener('click', function () { q.value = ''; closeQ(); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) closeQ(); });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
